<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre Secreto</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="container">
        <h1>Cofre Secreto</h1>
        <p class="subtitulo">Descubra a senha e desbloqueie o cofre!</p>

        <img id="imagemCofre" src="imagens/cofre-fechado.png" alt="Cofre fechado">

        <div class="jogo">
            <p>Digite uma senha entre 1 e 50:</p>
            <input type="number" id="numero" min="1" max="50" placeholder="Digite a senha">
            <button id="btnTentar" onclick="verificarSenha()">Tentar abrir</button>

            <p id="mensagem">Aguardando tentativa</p>
            <p id="tentativas">Tentativas: 0 / 5</p>
            <p id="alerta"></p>

            <button class="reiniciar" onclick="reiniciarJogo()">Reiniciar jogo</button>
        </div>
    </div>

    <!-- Caixa suspensa de sucesso -->
    <div id="overview">
        <div class="caixa">
            <h2>Cofre desbloqueado!</h2>
            <p id="resultado"></p>
            <button onclick="reiniciarJogo()">Jogar novamente</button>
        </div>
    </div>

    <script src="JS/script.js"></script>
</body>
</html>
